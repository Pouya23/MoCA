[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moca-calibration"
version = "0.1.0"
description = "Faithful, ablation-friendly implementation of Mixture of Calibrated Adapters (MoCA)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "accelerate>=1.0,<3",
  "datasets>=3.0,<5",
  "huggingface_hub>=0.27,<2",
  "numpy>=1.26",
  "peft>=0.13,<1",
  "PyYAML>=6.0",
  "rouge-score>=0.1.2",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.45,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
moca = "moca.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
